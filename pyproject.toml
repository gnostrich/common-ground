[project]
name = "common-ground"
version = "0.0.0"
description = "Minimal-faithful reconciliation engine, v0"
requires-python = ">=3.11"

# No runtime dependencies, deliberately. The seed hash keys every verdict, and a hash
# that depends on a linked LAPACK build or a wheel release is not reproducible. The
# engine ships its own SVD, RNG, and simplex arithmetic for exactly this reason. CI
# asserts this stays true.
dependencies = []

# No optional dependencies either. There was one — `live = ["anthropic>=0.60"]`, for a k=3
# extractor that no longer exists: the LM path is OpenRouter over stdlib urllib, and the
# Anthropic extractor was deleted rather than left dormant. An extra that installs a client
# nothing imports is a claim about this project that stopped being true.

[tool.setuptools]
packages = ["engine", "adapters"]
